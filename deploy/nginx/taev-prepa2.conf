# =============================================================================
#  taev-prepa2.conf — TAEV PREPA 2 (portal de alumnos + panel admin)
# -----------------------------------------------------------------------------
#  INSTALADO EN:  /root/nginx/conf.d/taev-prepa2.conf  (montado ro en nginx-proxy)
#  Esta copia es la fuente de verdad. rollout.sh la reinstala si cambió; a mano:
#      cp deploy/nginx/taev-prepa2.conf /root/nginx/conf.d/taev-prepa2.conf
#      docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
#
#  https://prepa2.grid.nimbuscloud.mx              → taev-prepa2-web   (portal)
#  https://prepa2.grid.nimbuscloud.mx/api/taev/*   → taev-prepa2-api
#  https://admin.prepa2.grid.nimbuscloud.mx        → taev-prepa2-admin (SPA)
#  https://admin.prepa2.grid.nimbuscloud.mx/api/*  → taev-prepa2-api
#
#  Cada dominio le habla a la API por SU MISMO ORIGEN (/api/...): sin CORS ni
#  preflight. Las imágenes se compilan con PUBLIC_API_URL = su propio dominio.
#
#  La API del panel (/api/admin/*) SÓLO se publica en el dominio admin. En el
#  portal devuelve 404: la superficie pública queda en lo que el alumno usa.
#
#  TLS:
#    prepa2.grid…        → wildcard *.grid.nimbuscloud.mx (ya existía).
#    admin.prepa2.grid…  → el wildcard NO lo cubre (es de tercer nivel). Tiene
#                          su propio certificado, emitido por DNS-01 contra
#                          Cloudflare, lineage /etc/letsencrypt/live/prepa2.grid.nimbuscloud.mx
#                          (SAN: prepa2.grid… + admin.prepa2.grid…). Lo renueva
#                          el mismo cron de certbot que los demás.
#
#  DNS: ambos nombres resuelven a la IP de casa por el wildcard *.grid (gris, no
#  proxied por Cloudflare): $remote_addr ya es la IP real del visitante.
# =============================================================================

# Fuerza bruta contra el login del panel, cortada en el borde antes de gastar
# un bcrypt por intento. La API tiene además su propio limiter.
limit_req_zone $binary_remote_addr zone=taev_admin_login:10m rate=5r/m;

# --- HTTP → HTTPS ------------------------------------------------------------
server {
    listen 80;
    server_name prepa2.grid.nimbuscloud.mx admin.prepa2.grid.nimbuscloud.mx;
    return 301 https://$host$request_uri;
}

# =============================================================================
#  Portal público de alumnos
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name prepa2.grid.nimbuscloud.mx;

    ssl_certificate     /etc/letsencrypt/live/grid.nimbuscloud.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grid.nimbuscloud.mx/privkey.pem;

    access_log /var/log/nginx/taev-prepa2-access.log;
    error_log  /var/log/nginx/taev-prepa2-error.log;

    # La API limita el JSON a 100kb; esto corta cuerpos absurdos antes.
    client_max_body_size 256k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeceras en el server block, no en los location (un add_header dentro
    # de un location reemplaza todos los heredados).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Sin SEO (regla del proyecto): fuera de los buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # El error_page global de nginx.conf redirige los 502/503/504 a
    # nimbuscloud.mx. Aquí no: un alumno en plena ventana de registro que
    # aterriza en otro sitio no entiende qué pasó. Se sobrescribe con un 503
    # propio (el JSON sigue el envelope de la API, así el portal lo muestra).
    error_page 502 503 504 = @taev_down;
    location @taev_down {
        default_type application/json;
        return 503 '{"data":false,"message":"Servicio temporalmente no disponible. Intenta de nuevo en un momento."}';
    }

    # La API del panel no se publica en el dominio de alumnos.
    location /api/admin/ {
        return 404;
    }

    location /api/ {
        set $api http://taev-prepa2-api:4000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location = /health {
        set $api http://taev-prepa2-api:4000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $web http://taev-prepa2-web:80;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
#  Panel de administración
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name admin.prepa2.grid.nimbuscloud.mx;

    ssl_certificate     /etc/letsencrypt/live/prepa2.grid.nimbuscloud.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prepa2.grid.nimbuscloud.mx/privkey.pem;

    access_log /var/log/nginx/taev-prepa2-admin-access.log;
    error_log  /var/log/nginx/taev-prepa2-admin-error.log;

    client_max_body_size 256k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    error_page 502 503 504 = @taev_admin_down;
    location @taev_admin_down {
        default_type application/json;
        return 503 '{"data":false,"message":"Servicio temporalmente no disponible."}';
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /api/admin/auth/login {
        limit_req zone=taev_admin_login burst=3 nodelay;
        limit_req_status 429;

        set $api http://taev-prepa2-api:4000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api http://taev-prepa2-api:4000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # El allocator puede tardar con un padrón grande.
        proxy_read_timeout    120s;
    }

    location = /health {
        set $api http://taev-prepa2-api:4000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $admin http://taev-prepa2-admin:80;
        proxy_pass $admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
