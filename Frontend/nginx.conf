# nginx interno del contenedor del portal: sólo sirve archivos estáticos.
# TLS, cabeceras de seguridad y el proxy a la API los pone nginx-proxy
# (deploy/nginx/taev-prepa2.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de nginx-proxy (TLS): una redirección absoluta saldría como
    # http://…:80. Relativa, el navegador conserva el https.
    absolute_redirect off;

    # Links por turno: /matutino/ → /matutino (el HTML es matutino.html).
    rewrite ^/(matutino|vespertino)/$ /$1 permanent;

    # Los assets de Astro llevan hash en el nombre: se pueden cachear para siempre.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # El HTML nunca se cachea: si no, tras un deploy el navegador pediría
        # bundles /_astro/ con hashes que ya no existen.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /index.html;
    }
}
