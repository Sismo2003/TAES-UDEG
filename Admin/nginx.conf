# nginx interno del contenedor del panel. Es una SPA: react-router resuelve
# /semestres, /padron, etc. en el navegador, así que cualquier ruta que no sea
# un archivo real tiene que devolver index.html (si no, recargar la página en
# una vista interna daría 404).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
